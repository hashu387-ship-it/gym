<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="Personal fitness, food and RICS APC study tracker" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Apex - Train, Fuel, Study</title>
<style>
  :root{
    --bg:#0b1220;--bg2:#0e1726;--card:rgba(22,33,58,.72);--card2:rgba(24,35,58,.9);--line:#243149;
    --text:#eaf0f7;--muted:#9fb0c3;--dim:#6b7c92;
    --teal:#2dd4bf;--teal2:#14b8a6;--deep:#0e7490;--emerald:#34d399;--amber:#f7b955;--amber-soft:#3a2e0a;--sky:#38bdf8;--violet:#a78bfa;
    --track:#22304a;--shadow:0 18px 40px rgba(0,0,0,.5);--r:20px;--sb:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(14,116,144,.35), transparent 60%),
      radial-gradient(700px 420px at -10% 16%, rgba(167,139,250,.12), transparent 60%),
      var(--bg);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;
  }
  .app{max-width:580px;margin:0 auto;padding:0 16px calc(98px + var(--sb))}
  /* hero */
  .hero{position:relative;margin:14px -16px 16px;padding:24px 22px 26px;border-radius:0 0 30px 30px;overflow:hidden;
    background:linear-gradient(150deg,#102036 0%,#0b1220 70%);box-shadow:var(--shadow)}
  .hero::before{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-160px;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(45,212,191,.0),rgba(45,212,191,.5),rgba(56,189,248,.35),rgba(167,139,250,.3),rgba(45,212,191,.0));
    filter:blur(26px);animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(11,18,32,.75));pointer-events:none}
  .hero>*{position:relative;z-index:1}
  .eyebrow{color:var(--teal);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:11px}
  .hero h1{margin:6px 0 4px;font-size:27px;line-height:1.12;letter-spacing:-.01em}
  .hero .sub{color:var(--muted);font-size:14px;max-width:46ch}
  .quote{margin-top:14px;padding:12px 14px;border-left:3px solid var(--teal);background:rgba(45,212,191,.07);border-radius:0 12px 12px 0;font-size:14px;color:var(--text);font-weight:600}
  /* primitives */
  .row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrapr{flex-wrap:wrap}
  .muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.center{text-align:center}
  .micro{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:800}
  h2.section{font-size:19px;margin:6px 2px 12px;letter-spacing:-.01em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;
    box-shadow:0 8px 22px rgba(0,0,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  .card h3{margin:0 0 4px;font-size:16px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800}
  .pill.teal{background:rgba(45,212,191,.14);color:var(--teal)}.pill.amber{background:var(--amber-soft);color:var(--amber)}
  .pill.dim{background:#1b2740;color:var(--muted)}.pill.violet{background:rgba(167,139,250,.14);color:var(--violet)}
  button{font:inherit;color:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:#1a2841;color:var(--text);border-radius:14px;padding:12px 16px;font-weight:800;min-height:48px;
    transition:transform .08s,filter .2s}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(135deg,var(--teal),var(--deep));color:#04201b;border:none;box-shadow:0 8px 20px rgba(45,212,191,.25)}
  .btn.block{width:100%}.btn.sm{min-height:40px;padding:8px 13px;border-radius:11px;font-size:13px}
  .link{background:none;border:none;color:var(--teal);padding:6px 0;font-weight:800;font-size:13px}
  /* checklist */
  .check{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:rgba(15,24,40,.6);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:10px;min-height:60px;transition:all .2s}
  .check:active{transform:scale(.985)}
  .check .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .25s}
  .check.done{background:rgba(45,212,191,.10);border-color:rgba(45,212,191,.45)}
  .check.done .box{background:var(--teal);border-color:var(--teal);transform:scale(1.05)}
  .check.done .label{color:var(--muted)}
  .check .label{font-weight:800}.check .hint{font-size:12px;color:var(--dim)}
  .tick{width:16px;height:16px}
  /* rings + meters */
  .ring-wrap{display:flex;align-items:center;gap:18px}
  .ring{position:relative;width:118px;height:118px;flex:none}.ring .pct{position:absolute;inset:0;display:grid;place-items:center}.ring .pct b{font-size:27px}
  .meter{height:12px;border-radius:999px;background:var(--track);overflow:hidden}
  .meter>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--emerald));transition:width .7s cubic-bezier(.2,.7,.3,1)}
  .meter.water>span{background:linear-gradient(90deg,var(--sky),var(--teal))}
  .meter.steps>span{background:linear-gradient(90deg,var(--amber),#fad27a)}
  /* timeline */
  .sched{position:relative;margin-left:6px;padding-left:20px}
  .sched::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .srow{position:relative;padding:7px 0;display:flex;gap:12px;align-items:flex-start}
  .srow::before{content:"";position:absolute;left:-20px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
  .srow.now::before{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 0 rgba(45,212,191,.6);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{from{box-shadow:0 0 0 0 rgba(45,212,191,.5)}to{box-shadow:0 0 0 12px rgba(45,212,191,0)}}
  .srow .t{width:48px;flex:none;font-weight:800;font-size:12px;color:var(--teal);font-variant-numeric:tabular-nums;padding-top:1px}
  .srow .w{font-size:13.5px;color:var(--muted)}.srow.now .w{color:var(--text);font-weight:700}
  /* exercises */
  .daysel{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.daysel::-webkit-scrollbar{display:none}
  .daysel button{white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:800;font-size:13px;flex:none;transition:all .2s}
  .daysel button.active{background:linear-gradient(135deg,var(--teal),var(--deep));color:#04201b;border-color:transparent}
  .exdemo{width:104px;height:84px;flex:none;background:#0f1828;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .fold{max-height:0;overflow:hidden;transition:max-height .35s ease}.fold.open{max-height:620px}
  .exbox{width:27px;height:27px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:transparent;transition:all .2s}
  .exbox.on{background:var(--teal);border-color:var(--teal)}
  .setrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-variant-numeric:tabular-nums}
  .setrow .del{background:none;border:none;color:var(--dim);font-weight:800;padding:4px 8px}
  input[type=number],input[type=text],input[type=date],textarea,select{background:#0f1828;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;width:100%}
  textarea{resize:vertical;min-height:60px}
  label.field .micro{margin-bottom:6px;display:block}
  .ins{display:flex;gap:8px}.ins input{text-align:center;font-weight:700}
  /* plate + food */
  .plate{width:150px;height:150px;border-radius:50%;margin:6px auto 2px;background:conic-gradient(var(--emerald) 0 50%,var(--deep) 50% 75%,var(--amber) 75% 100%);border:6px solid #0e1726;box-shadow:var(--shadow)}
  .legend span{display:inline-flex;align-items:center;gap:6px;margin:2px 8px 2px 0;font-size:12px;color:var(--muted)}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
  .acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;background:rgba(15,24,40,.55)}
  .acc>button{width:100%;text-align:left;background:transparent;border:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;min-height:54px}
  .acc .body{max-height:0;overflow:hidden;transition:max-height .35s ease}.acc.open .body{max-height:1200px}
  .acc .inner{padding:0 16px 16px}
  .acc h4{margin:12px 0 6px;font-size:12px;color:var(--teal);text-transform:uppercase;letter-spacing:.08em}
  .acc ul{margin:0;padding-left:18px}.acc li{margin:4px 0;color:var(--muted);font-size:14px}
  .chev{transition:transform .3s;color:var(--dim)}.acc.open .chev{transform:rotate(180deg)}
  /* stats, charts */
  .stat{background:rgba(15,24,40,.6);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .stat .n{font-size:22px;font-weight:800;letter-spacing:-.01em}.stat .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .chart{width:100%;height:190px}
  .chart .line{stroke:url(#lg);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .timer{font-size:58px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .timer.break{color:var(--amber)}
  .tl{position:relative;margin-left:8px;padding-left:22px}
  .tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl .node{position:relative;margin-bottom:14px}
  .tl .node::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
  .tl .node.done::before{background:var(--teal);border-color:var(--teal)}
  .note{border:1px solid var(--amber-soft);background:rgba(247,185,85,.06);border-radius:14px;padding:14px;margin-bottom:14px}
  .note .micro{color:var(--amber)}
  /* nav */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:2px;padding:8px 8px calc(8px + var(--sb));
    background:rgba(11,18,32,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .nav .tab{flex:1;max-width:112px;background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11px;font-weight:800;border-radius:12px;transition:color .2s,transform .15s}
  .nav .tab:active{transform:scale(.94)}
  .nav .tab.active{color:var(--teal)}
  .nav .tab svg{width:24px;height:24px}.nav .tab.active svg{filter:drop-shadow(0 0 9px rgba(45,212,191,.55))}
  .panel{display:none}.panel.active{display:block;animation:fade .35s ease both}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* rest sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.7,.3,1);
    background:linear-gradient(180deg,#13203a,#0e1726);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:none;
    padding:22px 20px calc(24px + var(--sb));max-width:580px;margin:0 auto;box-shadow:0 -18px 50px rgba(0,0,0,.6)}
  .sheet.open{transform:translateY(0)}
  .resttime{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--teal)}
  .countchip{font-weight:800;color:var(--violet)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="eyebrow">Apex - your daily system</div>
    <h1 id="heroTitle">Good day</h1>
    <div class="sub" id="heroSub"></div>
    <div class="quote" id="heroQuote"></div>
  </header>
  <main>
    <section class="panel active" id="p-home"></section>
    <section class="panel" id="p-train"></section>
    <section class="panel" id="p-fuel"></section>
    <section class="panel" id="p-study"></section>
    <section class="panel" id="p-progress"></section>
  </main>
</div>

<div class="sheet" id="restSheet">
  <div class="micro center">Rest - breathe, then go again</div>
  <div class="resttime" id="restTime">90</div>
  <div class="row" style="gap:8px;justify-content:center;margin-top:8px">
    <button class="btn" data-action="restAdd">+30s</button>
    <button class="btn primary" data-action="restEnd">Done - next set</button>
  </div>
</div>

<nav class="nav" id="nav">
  <button class="tab active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
  <button class="tab" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>Train</button>
  <button class="tab" data-tab="fuel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v8a3 3 0 006 0V3M8 3v18M19 3c-2 1-3 3-3 6s1 4 3 4v8"/></svg>Fuel</button>
  <button class="tab" data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l9-3 9 3-9 3-9-3z"/><path d="M21 6v6M7 8v6c0 1.5 10 1.5 10 0V8"/></svg>Study</button>
  <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>Progress</button>
</nav>

<script>
"use strict";
(() => {
  // ============ state ============
  const KEY = "apexTracker.v2";
  const dprofile = () => ({ startKg:98, goalKg:78, heightCm:165, age:32, sex:"male",
    activity:1.45, deficit:750, proteinPerKg:1.9, pace:1.0, startDate:todayKey(), examDate:"2026-11-01" });

  const state = load();
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.profile) return migrate(s);
    }catch(e){}
    // migrate from v1 tracker if present
    try{
      const v1 = JSON.parse(localStorage.getItem("ricsTracker.v1"));
      if (v1 && v1.profile){
        const s = fresh();
        s.days = v1.days || {}; s.weights = v1.weights || []; s.study = Object.assign(s.study, v1.study || {});
        return s;
      }
    }catch(e){}
    return fresh();
  }
  function fresh(){ return { profile:dprofile(), days:{}, weights:[], waist:[],
    study:{ nextTask:"", comps:{}, milestones:{} }, settings:{ stepGoal:9000, waterGoal:8 } }; }
  function migrate(s){
    s.profile = Object.assign(dprofile(), s.profile);
    s.settings = s.settings || { stepGoal:9000, waterGoal:8 };
    s.study = s.study || { nextTask:"", comps:{}, milestones:{} };
    s.weights = s.weights || []; s.waist = s.waist || []; s.days = s.days || {};
    return s;
  }
  const save = () => localStorage.setItem(KEY, JSON.stringify(state));

  // ============ dates ============
  function todayKey(d){ d = d || new Date(); return d.toLocaleDateString("en-CA"); }
  function addDaysKey(k,n){ const p = k.split("-"); const d = new Date(+p[0], +p[1]-1, +p[2]); d.setDate(d.getDate()+n); return todayKey(d); }
  function weekdayOf(k){ const p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]).getDay(); }
  const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const MONN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const prettyDate = k => { const p = k.split("-"); return `${+p[2]} ${MONN[+p[1]-1]} ${p[0]}`; };
  const prettyMonth = d => `${MONN[d.getMonth()]} ${d.getFullYear()}`;

  function day(k){
    k = k || todayKey();
    if (!state.days[k]) state.days[k] = { check:{}, steps:0, water:0, focus:0, workout:{done:false,feel:"",note:""}, exDone:{}, sets:{} };
    const d = state.days[k];
    d.check = d.check||{}; d.workout = d.workout||{done:false,feel:"",note:""}; d.exDone = d.exDone||{}; d.sets = d.sets||{};
    if (d.steps==null) d.steps=0; if (d.water==null) d.water=0; if (d.focus==null) d.focus=0;
    return d;
  }

  // ============ content ============
  const QUOTES = [
    "Discipline is choosing what you want most over what you want now.",
    "You do not need a perfect day. You need a finished one.",
    "The gym is one hour. The other twenty-three decide the result.",
    "Slow is smooth, and smooth is fast.",
    "Every rep you log is a vote for the person you are becoming.",
    "You will not always feel motivated. Be consistent instead.",
    "A thirty-minute walk beats a perfect plan you skipped.",
    "Protein first. Panic never.",
    "The scale measures one thing. Your habits measure everything.",
    "Show up tired. Leave proud.",
    "Your APC and your health are built the same way: daily, quietly, on purpose.",
    "The only benchmark that matters is you, last week.",
    "Steady beats dramatic. Every time.",
    "Hard days count double."
  ];
  const quoteToday = () => { const d=new Date(); const n=Math.floor((d-new Date(d.getFullYear(),0,0))/86400000); return QUOTES[n % QUOTES.length]; };

  const CHECK = [
    { id:"protein", label:"Protein breakfast", hint:"Eggs, yogurt or oats with whey" },
    { id:"water",   label:"Water through the day", hint:"Aim for about 8 glasses" },
    { id:"move",    label:"Training or walk done", hint:"Movement counts, even short" },
    { id:"study",   label:"Study blocks done", hint:"One focused block is a win" },
    { id:"noSnack", label:"No late-night snacks", hint:"Kitchen closed after dinner" },
    { id:"sleep",   label:"Sleep by 11", hint:"Wind down, screens away" }
  ];
  const GOOD_MIN = 4;

  // personalised day schedules (work Sun-Thu, home 18:15, class Sun 19-21, off Fri-Sat)
  const SCHED = {
    work: [ ["06:50","Wake. Two glasses of water before anything else"],
      ["07:10","Protein breakfast (about 35 g protein)"],["07:45","Commute. Podcast or APC audio notes"],
      ["10:30","Office snack: yogurt or a handful of nuts"],["12:30","Lunch: plate rule - grilled, never fried"],
      ["16:00","Snack: fruit or boiled eggs, plus a 10-minute walk"],["18:15","Home. Change straight into gym clothes"],
      ["18:45","Training session (see Train tab)"],["20:00","Dinner: protein and vegetables, light carb"],
      ["21:00","Study: one or two 25-minute focus blocks"],["22:30","Wind down. No screens, no caffeine"],["23:00","Sleep"] ],
    sunday: [ ["06:50","Wake. Two glasses of water"],["07:10","Protein breakfast"],
      ["10:30","Office snack: yogurt or nuts"],["12:30","Lunch: plate rule"],["16:00","Snack and a 10-minute walk"],
      ["18:15","Home. Light early dinner"],["19:00","CPD class until 9 pm"],["21:15","Optional easy 15-minute walk, then wind down"],["23:00","Sleep"] ],
    friday: [ ["08:00","Wake gently. Water first"],["08:30","Protein breakfast"],
      ["09:30","Gym: Lower body + a longer easy cardio finish"],["11:30","Shower, Friday prayer and family time"],
      ["14:00","Lunch: plate rule"],["16:00","Study: two focus blocks (case study first)"],
      ["19:30","Dinner"],["22:30","Wind down"],["23:00","Sleep"] ],
    saturday: [ ["08:00","Wake. Water first"],["08:30","Protein breakfast"],
      ["09:30","Conditioning session: cardio, core and mobility"],["12:30","Lunch"],
      ["15:00","Study: two focus blocks"],["17:00","Meal prep for the work week (chicken, rice, salad boxes)"],
      ["19:30","Dinner"],["22:30","Wind down"],["23:00","Sleep"] ]
  };
  const schedFor = wd => wd===0 ? SCHED.sunday : wd===5 ? SCHED.friday : wd===6 ? SCHED.saturday : SCHED.work;

  // exercise library: name, animation pattern, cues, common mistakes
  const EX = {
    bench:   { n:"Barbell bench press", p:"press", c:["Shoulder blades pinned back and down","Bar touches mid-chest, wrists stacked","Feet planted, drive through the floor","Press up and slightly back"], m:["Bouncing the bar off the chest","Flaring elbows to 90 degrees"] },
    incdb:   { n:"Incline dumbbell press", p:"press", c:["Bench at 30 degrees","Lower until you feel the chest stretch","Press up and slightly back over the eyes","Control every centimetre down"], m:["Arching off the bench","Clanging the dumbbells at the top"] },
    mpress:  { n:"Machine chest press", p:"press", c:["Seat set so handles meet mid-chest","Push to just short of lockout","Slow two-second return","Keep shoulders down away from ears"], m:["Half reps","Letting the weight stack slam"] },
    ohp:     { n:"Seated dumbbell shoulder press", p:"press", c:["Ribs down, core braced","Press straight up, no arching","Lower to ear height","Exhale as you press"], m:["Leaning back to cheat the weight up","Locking elbows hard"] },

    // weekly review (last 7 days)

      <div class="card"><div class="row between"><h3>Weight trend</h3><span class="pill teal">goal ${goal} kg</span></div>${chart(w,goal)}

  function chart(w, goal){
    const W=480,H=180,pad=24;
    if (w.length<2) return `<div class="center muted small" style="padding:40px 10px">Log your weight on two or more days and your trend line will draw itself here.</div>`;
    const kgs = w.map(p=>p.kg).concat([goal]);
    const min = Math.min(...kgs)-1, max = Math.max(...kgs)+1, span = Math.max(1,max-min), n = w.length;
    const x = i => pad + i/(n-1)*(W-2*pad);
    const y = v => pad + (1-(v-min)/span)*(H-2*pad);
    const pts = w.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.kg).toFixed(1)}`).join(" ");
    let len=0; for (let i=1;i<n;i++) len += Math.hypot(x(i)-x(i-1), y(w[i].kg)-y(w[i-1].kg));
    const gy = y(goal).toFixed(1);
    const dots = w.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.kg).toFixed(1)}" r="3" fill="var(--teal)"/>`).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient></defs>
      <line x1="${pad}" y1="${gy}" x2="${W-pad}" y2="${gy}" stroke="var(--emerald)" stroke-width="1.5" stroke-dasharray="3 6"/>
      <path class="line" d="${pts}" style="--len:${len.toFixed(0)}"/>${dots}
      <text x="${pad}" y="14" fill="var(--dim)" font-size="11">${max.toFixed(0)} kg</text>
      <text x="${pad}" y="${H-6}" fill="var(--dim)" font-size="11">${min.toFixed(0)} kg</text></svg>`;
  }

  // ============ focus timer ============
  const timer = { mode:"focus", remaining:1500, running:false, h:null };
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  function syncTimer(){
    const disp = $("timerDisp"); if (!disp) return;
    disp.textContent = fmt(timer.remaining);
    disp.classList.toggle("break", timer.mode==="break");
    const m = $("timerMode"); if (m) m.textContent = timer.mode==="break" ? "Short break" : "Focus";
    const b = $("timerBtn"); if (b) b.textContent = timer.running ? "Pause" : (timer.remaining < (timer.mode==="break"?300:1500) ? "Resume" : "Start");
    const fc = $("focusCount"); if (fc) fc.textContent = day().focus;
  }
  function tickTimer(){
    if (!timer.running) return;
    timer.remaining--;
    if (timer.remaining<=0){
      if (timer.mode==="focus"){ day().focus++; save(); vibrate(150); timer.mode="break"; timer.remaining=300; }
      else { timer.mode="focus"; timer.remaining=1500; }
      timer.running=false; clearInterval(timer.h); timer.h=null;
    }
    syncTimer();
  }
  function startTimer(){
    if (timer.running){ timer.running=false; clearInterval(timer.h); timer.h=null; syncTimer(); return; }
    timer.running=true; timer.h=setInterval(tickTimer,1000); syncTimer();
  }
  function resetTimer(){ timer.running=false; clearInterval(timer.h); timer.h=null; timer.mode="focus"; timer.remaining=1500; syncTimer(); }

  // ============ rest timer (with wake lock) ============
  let rest = { left:0, h:null }, wakeLock = null;
  const vibrate = ms => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
  async function lockScreen(){ try{ if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request("screen"); }catch(e){} }
  function unlockScreen(){ try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null; }
  function openRest(sec){
    rest.left = sec; $("restTime").textContent = rest.left;
    document.getElementById("restSheet").classList.add("open");
    vibrate(40); lockScreen();
    clearInterval(rest.h);
    rest.h = setInterval(() => {
      rest.left--;
      $("restTime").textContent = Math.max(0,rest.left);
      if (rest.left<=0){ closeRest(); vibrate(250); }
    },1000);
  }
  function closeRest(){ clearInterval(rest.h); rest.h=null; document.getElementById("restSheet").classList.remove("open"); unlockScreen(); }

  // ============ routing + events ============
  const R = { home:renderHome, train:renderTrain, fuel:renderFuel, study:renderStudy, progress:renderProgress };
  let current = "home";
  function show(tab){
    current = tab;
    document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
    $("p-"+tab).classList.add("active");
    document.querySelectorAll(".nav .tab").forEach(t=>t.classList.toggle("active", t.dataset.tab===tab));
    R[tab]();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  document.getElementById("nav").addEventListener("click", e => { const t = e.target.closest(".tab"); if (t) show(t.dataset.tab); });

  document.addEventListener("click", e => {
    const b = e.target.closest("[data-action]"); if (!b) return;
    const a = b.dataset.action, k = todayKey(), d = day(k);
    if (a==="toggleCheck"){ d.check[b.dataset.id] = !d.check[b.dataset.id]; vibrate(15); save(); renderHome(); }
    else if (a==="go"){ show(b.dataset.tab); }
    else if (a==="selDay"){ selDay = +b.dataset.i; renderTrain(); }
    else if (a==="toggleWorkout"){ d.workout.done = !d.workout.done; if (d.workout.done) d.check.move = true; vibrate(25); save(); renderTrain(); }
    else if (a==="exDone"){ d.exDone[b.dataset.id] = !d.exDone[b.dataset.id]; vibrate(15); save(); renderTrain(); }
    else if (a==="how"){ const h = $("how-"+b.dataset.id); if (h) h.classList.toggle("open"); }
    else if (a==="logToggle"){ const h = $("log-"+b.dataset.id); if (h) h.classList.toggle("open"); }
    else if (a==="addSet"){
      const id = b.dataset.id, w = parseFloat(($("w-"+id)||{}).value), r = parseInt(($("r-"+id)||{}).value,10);
      if (isFinite(w) && isFinite(r) && r>0){ (d.sets[id] = d.sets[id]||[]).push({w:Math.round(w*2)/2, r}); vibrate(20); save(); renderTrain();
        const h = $("log-"+id); if (h) h.classList.add("open"); }
    }
    else if (a==="delSet"){ const id=b.dataset.id, i=+b.dataset.i; (d.sets[id]||[]).splice(i,1); save(); renderTrain(); const h=$("log-"+id); if (h) h.classList.add("open"); }
    else if (a==="rest"){ openRest(+b.dataset.n || 90); }
    else if (a==="restAdd"){ rest.left += 30; $("restTime").textContent = rest.left; }
    else if (a==="restEnd"){ closeRest(); }
    else if (a==="steps"){ d.steps = Math.max(0, d.steps + (+b.dataset.n)); save(); renderTrain(); }
    else if (a==="water"){ d.water = Math.max(0, d.water + (+b.dataset.n)); if (d.water>=state.settings.waterGoal) d.check.water = true; vibrate(15); save(); renderFuel(); }
    else if (a==="acc"){ const ac = $("acc"+b.dataset.i); if (ac) ac.classList.toggle("open"); }
    else if (a==="toggleComp"){ state.study.comps[b.dataset.id] = !state.study.comps[b.dataset.id]; save(); renderStudy(); }
    else if (a==="toggleMs"){ state.study.milestones[b.dataset.id] = !state.study.milestones[b.dataset.id]; save(); renderStudy(); }
    else if (a==="timerStart"){ startTimer(); }
    else if (a==="timerReset"){ resetTimer(); }
    else if (a==="addWeight"){
      const v = parseFloat((($("wkg")||{}).value||"").replace(",","."));
      if (isFinite(v) && v>30 && v<400){ state.weights = state.weights.filter(p=>p.date!==k); state.weights.push({date:k,kg:Math.round(v*10)/10});
        state.weights.sort((x,y)=>x.date<y.date?-1:1); save(); renderProgress(); }
    }
    else if (a==="addWaist"){
      const v = parseFloat((($("wcm")||{}).value||"").replace(",","."));
      if (isFinite(v) && v>40 && v<250){ state.waist = state.waist.filter(p=>p.date!==k); state.waist.push({date:k,cm:Math.round(v*2)/2});
        state.waist.sort((x,y)=>x.date<y.date?-1:1); save(); renderProgress(); }
    }
    else if (a==="export"){
      const blob = new Blob([JSON.stringify({app:"Apex",exportedAt:new Date().toISOString(),state},null,2)],{type:"application/json"});
      const a2 = document.createElement("a"); a2.href = URL.createObjectURL(blob); a2.download = "apex-backup.json"; a2.click();
      setTimeout(()=>URL.revokeObjectURL(a2.href),5000);
    }
    else if (a==="install"){ if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt = null; const btn=$("installBtn"); if (btn) btn.style.display="none"; } }
  });

  document.addEventListener("change", e => {
    const b = e.target.closest("[data-bind]"); if (!b) return;
    const bind = b.dataset.bind;
    if (bind==="nextTask"){ state.study.nextTask = b.value; save(); return; }
    if (bind==="examDate"){ if (b.value){ state.profile.examDate = b.value; save(); renderStudy(); } return; }
    if (["startKg","goalKg","heightCm","age"].includes(bind)){
      const v = parseFloat(b.value);
      if (isFinite(v) && v>0){ state.profile[bind] = v; save(); renderProgress(); }
    }
  });
  document.addEventListener("input", e => { const b = e.target.closest('[data-bind="nextTask"]'); if (b){ state.study.nextTask = b.value; save(); } });

  // ============ PWA ============
  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; const b=$("installBtn"); if (b) b.style.display=""; });
  if ("serviceWorker" in navigator){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }

  // ============ boot ============
  (function boot(){
    const h = new Date().getHours();
    $("heroTitle").textContent = h<12 ? "Good morning" : h<17 ? "Good afternoon" : "Good evening";
    const lost = state.profile.startKg - latestKg();
    $("heroSub").textContent = `98 kg to 78 kg, the APC in November, and a calmer, stronger you. ${lost>0?`Already ${lost.toFixed(1)} kg down.`:"Day one starts now."}`;
    $("heroQuote").textContent = quoteToday();
    show("home");
  })();
})();
</script>
</body>
</html>
