<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<title>Daily Tracker - Fitness, Food & RICS</title>
<style>
  :root{
    --bg:#0b1220;--card:#131d2e;--card2:#18233a;--line:#243149;--text:#eaf0f7;--muted:#9fb0c3;--dim:#6b7c92;
    --teal:#2dd4bf;--teal-deep:#0e7490;--emerald:#34d399;--amber:#f7b955;--amber-soft:#3a2e0a;
    --ring-track:#22304a;--shadow:0 14px 34px rgba(0,0,0,.45);--radius:18px;--sb:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(1200px 600px at 50% -10%,#14233c 0%,var(--bg) 55%) fixed;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + var(--sb))}
  .hero{position:relative;overflow:hidden;margin:14px -16px 18px;padding:22px 20px 24px;border-radius:0 0 28px 28px;
    background:linear-gradient(135deg,rgba(14,116,144,.55),rgba(13,18,32,.2)),linear-gradient(160deg,#102036,#0b1220);box-shadow:var(--shadow)}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 85% -20%,rgba(45,212,191,.35),transparent 60%);animation:glow 9s ease-in-out infinite alternate;pointer-events:none}
  @keyframes glow{from{opacity:.5;transform:translateY(-4px)}to{opacity:1;transform:translateY(4px)}}
  .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.16;z-index:0}
  .hero>*{position:relative;z-index:1}
  .hero .eyebrow{color:var(--teal);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11px}
  .hero h1{margin:6px 0 2px;font-size:26px;line-height:1.15}
  .hero .sub{color:var(--muted);font-size:14px}
  .row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
  .muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.center{text-align:center}
  .micro{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
  h2.section{font-size:20px;margin:4px 2px 12px}
  .card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:rise .4s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card h3{margin:0 0 4px;font-size:16px}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pill.teal{background:rgba(45,212,191,.14);color:var(--teal)}.pill.amber{background:var(--amber-soft);color:var(--amber)}.pill.dim{background:#1b2740;color:var(--muted)}
  button{font:inherit;color:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:#1a2841;color:var(--text);border-radius:14px;padding:12px 16px;font-weight:700;min-height:48px;transition:transform .08s,background .2s,border-color .2s}
  .btn:active{transform:scale(.97)}.btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#04201b;border:none}.btn.block{width:100%}
  .check{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#16213a;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;min-height:60px;transition:background .2s,border-color .2s,transform .08s}
  .check:active{transform:scale(.99)}
  .check .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .2s}
  .check.done{background:rgba(45,212,191,.10);border-color:rgba(45,212,191,.5)}.check.done .box{background:var(--teal);border-color:var(--teal)}.check.done .label{color:var(--muted)}
  .check .label{font-weight:700}.check .hint{font-size:12px;color:var(--dim)}.tick{width:16px;height:16px}
  .ring-wrap{display:flex;align-items:center;gap:18px}.ring{position:relative;width:116px;height:116px;flex:none}.ring .pct{position:absolute;inset:0;display:grid;place-items:center}.ring .pct b{font-size:26px}
  .meter{height:12px;border-radius:999px;background:var(--ring-track);overflow:hidden}.meter>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--emerald));transition:width .6s ease}
  .meter.water>span{background:linear-gradient(90deg,#38bdf8,#2dd4bf)}.meter.steps>span{background:linear-gradient(90deg,var(--amber),#fad27a)}
  .plate{width:150px;height:150px;border-radius:50%;margin:6px auto 2px;background:conic-gradient(var(--emerald) 0 50%,var(--teal-deep) 50% 75%,var(--amber) 75% 100%);border:6px solid #0e1726;box-shadow:var(--shadow)}
  .legend span{display:inline-flex;align-items:center;gap:6px;margin:2px 8px 2px 0;font-size:12px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  input[type=number],input[type=text],textarea,select{background:#0f1828;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;width:100%}
  textarea{resize:vertical;min-height:64px}label.field{display:block}label.field .micro{margin-bottom:6px;display:block}
  .acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;background:#16213a}
  .acc>button{width:100%;text-align:left;background:transparent;border:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;min-height:54px}
  .acc .body{max-height:0;overflow:hidden;transition:max-height .35s ease}.acc.open .body{max-height:1200px}.acc .inner{padding:0 16px 16px}
  .acc h4{margin:12px 0 6px;font-size:13px;color:var(--teal);text-transform:uppercase;letter-spacing:.08em}.acc ul{margin:0;padding-left:18px}.acc li{margin:4px 0;color:var(--muted)}
  .chev{transition:transform .3s;color:var(--dim)}.acc.open .chev{transform:rotate(180deg)}
  .timer{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}.timer.break{color:var(--amber)}
  .tl{position:relative;margin-left:8px;padding-left:22px}.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl .node{position:relative;margin-bottom:14px}.tl .node::before{content:"";position:absolute;left:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}.tl .node.done::before{background:var(--teal);border-color:var(--teal)}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:2px;padding:8px 8px calc(8px + var(--sb));background:rgba(11,18,32,.86);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
  .nav .tab{flex:1;max-width:110px;background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11px;font-weight:700;border-radius:12px;transition:color .2s}
  .nav .tab.active{color:var(--teal)}.nav .tab svg{width:24px;height:24px}.nav .tab.active svg{filter:drop-shadow(0 0 8px rgba(45,212,191,.5))}
  .panel{display:none}.panel.active{display:block;animation:fade .35s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .note{border:1px solid var(--amber-soft);background:rgba(247,185,85,.06);border-radius:14px;padding:14px}.note .micro{color:var(--amber)}
  .stat{background:#16213a;border:1px solid var(--line);border-radius:14px;padding:12px 14px}.stat .n{font-size:22px;font-weight:800}.stat .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
  .chart{width:100%;height:180px}.chart .line{stroke:var(--teal);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.1s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
  .daysel{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px}.daysel button{white-space:nowrap;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:700;font-size:13px;flex:none}.daysel button.active{background:var(--teal);color:#04201b;border-color:transparent}
  .ex{display:flex;flex-direction:column;gap:6px}
  .exdemo{width:96px;height:78px;flex:none;background:#0f1828;border:1px solid var(--line);border-radius:12px;overflow:hidden}.exdemo svg{display:block}
  .link{background:none;border:none;color:var(--teal);padding:6px 0;font-weight:700;font-size:13px}
  .how{max-height:0;overflow:hidden;transition:max-height .3s ease}.how.open{max-height:340px}
  .exbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none}.exbox.on{background:var(--teal);border-color:var(--teal)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <img class="hero-img" alt="" src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=1280&q=55" onerror="this.remove()" />
    <div class="eyebrow">Steady habits</div>
    <h1 id="heroTitle">Good day</h1>
    <div class="sub" id="heroSub">From 98 kg toward 78 kg - the safe, lasting way.</div>
  </header>
  <main>
    <section class="panel active" id="p-today"></section>
    <section class="panel" id="p-workout"></section>
    <section class="panel" id="p-food"></section>
    <section class="panel" id="p-study"></section>
    <section class="panel" id="p-progress"></section>
  </main>
</div>
<nav class="nav" id="nav">
  <button class="tab active" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Today</button>
  <button class="tab" data-tab="workout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>Workout</button>
  <button class="tab" data-tab="food"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v8a3 3 0 006 0V3M8 3v18M19 3c-2 1-3 3-3 6s1 4 3 4v8"/></svg>Food</button>
  <button class="tab" data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l9-3 9 3-9 3-9-3z"/><path d="M21 6v6M7 8v6c0 1.5 10 1.5 10 0V8"/></svg>Study</button>
  <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>Progress</button>
</nav>

<script>
"use strict";
(function(){
  var KEY="ricsTracker.v1";
  var state=load();
  function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.profile)return migrate(s);}catch(e){}
    return{profile:dprofile(),days:{},weights:[],study:{nextTask:"",comps:{},milestones:{}},settings:{stepGoal:9000,waterGoal:8}};}
  function dprofile(){return{startKg:98,goalKg:78,heightCm:165,age:32,sex:"male",activity:1.5,deficit:650,proteinPerKg:1.9,pace:0.75,startDate:todayKey()};}
  function migrate(s){var p=dprofile();s.profile=Object.assign({},p,s.profile||{});
    if(s.profile.startKg===97)s.profile.startKg=98; if(s.profile.goalKg===80)s.profile.goalKg=78;
    s.settings=s.settings||{stepGoal:9000,waterGoal:8};s.study=s.study||{nextTask:"",comps:{},milestones:{}};s.weights=s.weights||[];s.days=s.days||{};return s;}
  function save(){localStorage.setItem(KEY,JSON.stringify(state));}

  function todayKey(d){d=d||new Date();return d.toLocaleDateString("en-CA");}
  function addDaysKey(k,n){var p=k.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);d.setDate(d.getDate()+n);return todayKey(d);}
  function weekdayOf(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]).getDay();}
  var DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function prettyDate(k){var p=k.split("-");return +p[2]+" "+MON[+p[1]-1]+" "+p[0];}
  function prettyMonth(d){return MON[d.getMonth()]+" "+d.getFullYear();}

  function day(k){k=k||todayKey();if(!state.days[k])state.days[k]={check:{},steps:0,water:0,focus:0,workout:{done:false,feel:"",note:""},exDone:{}};
    var d=state.days[k];d.check=d.check||{};d.workout=d.workout||{done:false,feel:"",note:""};d.exDone=d.exDone||{};
    if(d.steps==null)d.steps=0;if(d.water==null)d.water=0;if(d.focus==null)d.focus=0;return d;}

  var CHECK=[{id:"protein",label:"Protein breakfast",hint:"Eggs, yogurt or similar"},{id:"water",label:"Water through the day",hint:"Sip steadily, aim ~8 glasses"},
    {id:"move",label:"Gym or walk",hint:"Movement counts, even short"},{id:"study",label:"Study blocks done",hint:"One focused block is a win"},
    {id:"noSnack",label:"No late-night snacks",hint:"Kitchen closed after dinner"},{id:"sleep",label:"Sleep by 11",hint:"Wind down, screens away"}];
  var GOOD_DAY_MIN=4;
  var WEEK={0:{t:"Class day",d:"CPD class 7-9 pm. Optional short walk.",tag:"Rest / class"},1:{t:"Full-body weights + 10 min cardio",d:"About 45 minutes.",tag:"Strength"},
    2:{t:"30-35 min cardio + core",d:"Steady cardio you enjoy, then core.",tag:"Cardio"},3:{t:"30-minute walk",d:"Easy, conversational pace.",tag:"Walk"},
    4:{t:"Full-body weights + 10 min cardio",d:"Aim to beat last week a little.",tag:"Strength"},5:{t:"30-minute walk",d:"Gentle day off the weights.",tag:"Walk"},
    6:{t:"Longer cardio + weights",d:"Your bigger session, no rush.",tag:"Strength + cardio"}};

  // exercise library
  function ex(n,p,s,c){return{n:n,p:p,s:s,c:c};}
  var E={
    squat:ex("Goblet squat","squat","3 x 10-12",["Feet shoulder-width, toes slightly out","Sit back and down, chest tall","Knees track over your toes","Drive up through your heels"]),
    press:ex("Push-up or chest press","press","3 x 8-12",["Hands under shoulders / bar over chest","Lower with control, elbows about 45 degrees","Straight line head to heels","Press all the way up"]),
    row:ex("Dumbbell row","row","3 x 10-12 each side",["Hinge forward, back flat","Pull to your waist, elbow close","Squeeze the shoulder blade","Lower slowly"]),
    ohp:ex("Shoulder press","press","3 x 8-12",["Brace your core, ribs down","Press overhead, no arching","Lower to ear height","Control the weight"]),
    rdl:ex("Romanian deadlift","hinge","3 x 8-10",["Soft knees, hinge at the hips","Keep the weight close to your legs","Feel the hamstring stretch","Stand tall, squeeze glutes"]),
    lunge:ex("Walking lunge","squat","3 x 10 per leg",["Step forward, both knees about 90 degrees","Front knee over the ankle","Push back up tall","Alternate legs"]),
    pull:ex("Lat pulldown or assisted pull-up","pull","3 x 8-10",["Grip a little wider than shoulders","Pull to upper chest, elbows down","No leaning back","Control the way up"]),
    lateral:ex("Lateral raise","lateral","3 x 12-15",["Soft elbows","Lift to shoulder height only","Lead with the elbows","Lower slowly"]),
    curl:ex("Biceps curl","curl","3 x 10-12",["Elbows fixed at your sides","Curl up, no swinging","Squeeze at the top","Lower under control"]),
    calf:ex("Calf raise","calf","3 x 15-20",["Rise onto your toes fully","Pause at the top","Lower slowly for the stretch","Hold something for balance"]),
    plank:ex("Plank","plank","3 x 30-45 sec",["Forearms under shoulders","Straight line head to heels","Brace your stomach","Breathe steadily"]),
    cardio:ex("Cardio (treadmill, bike or rower)","cardio","30-35 min easy",["A pace you can still talk at","Warm up for 3-5 minutes","Tall posture, relaxed shoulders","Cool down at the end"]),
    cardio10:ex("Cardio finish","cardio","10 min easy",["Light pace to finish the session","Keep breathing easy","A gentle cool-down"]),
    walk:ex("Walk","walk","30 minutes",["Easy, steady pace","Relaxed shoulders, tall posture","Aim toward your step target"])
  };
  var PLAN={1:[E.squat,E.press,E.row,E.ohp,E.rdl,E.plank,E.cardio10],2:[E.cardio,E.plank],3:[E.walk],
    4:[E.lunge,E.pull,E.press,E.lateral,E.curl,E.calf,E.cardio10],5:[E.walk],6:[E.squat,E.row,E.ohp,E.rdl,E.lunge,E.plank,E.cardio],0:[E.walk]};

  var RECIPES=[
    {name:"Vegetable masala omelette",tag:"Breakfast",time:"10 min",ing:["3 eggs (or 2 eggs + extra whites)","Onion, tomato, capsicum, chopped","A handful of spinach","Pinch turmeric, chilli, salt","1 tsp olive oil"],steps:["Beat the eggs with a little salt.","Soften the vegetables in the oil 2-3 minutes.","Pour in eggs, add spices, fold until just set.","Serve with salad rather than bread most days."]},
    {name:"Yogurt grilled chicken, salad & small rice",tag:"Lunch / dinner",time:"25 min + marinate",ing:["Chicken breast or thigh","3-4 tbsp plain yogurt","Garlic, ginger, lemon, paprika, salt","A big mixed salad","Small palm-sized rice"],steps:["Marinate chicken in yogurt, garlic, ginger, lemon, spices (20+ min).","Grill or pan-cook until cooked through.","Half the plate salad, add chicken and a small rice portion."]},
    {name:"Chicken & vegetable stir-fry",tag:"Lunch / dinner",time:"20 min",ing:["Sliced chicken","Broccoli, carrot, capsicum, beans","Garlic, ginger","1 tbsp low-sodium soy, splash vinegar","1 tsp oil"],steps:["Cook chicken on high until done, set aside.","Stir-fry vegetables 3-4 minutes, keep them crunchy.","Return chicken, add garlic, ginger, sauce, toss 1 minute.","Serve as is or with a small rice portion."]},
    {name:"Curd / yogurt with nuts & fruit",tag:"Snack",time:"3 min",ing:["1 cup plain curd or Greek yogurt","Small handful of nuts","Berries, apple or banana","Optional pinch of cinnamon"],steps:["Spoon yogurt into a bowl.","Top with nuts and chopped fruit.","A steady protein snack instead of fried or sugary options."]}
  ];
  var COMPS={"Mandatory":["Ethics, Rules of Conduct & professionalism","Client care","Communication & negotiation","Health & safety","Accounting principles & procedures","Business planning","Conflict avoidance, management & dispute resolution","Data management","Diversity, inclusion & teamworking","Sustainability"],
    "Technical (QS pathway)":["Quantification & costing of construction works","Design economics & cost planning","Commercial management of construction","Contract practice","Procurement & tendering","Project financial control & reporting","Construction technology & environmental services"]};
  var MILESTONES=[{id:"m1",when:"Start now",t:"Case study + main technical competencies",d:"Draft your case study and build your strongest technical examples first."},
    {id:"m2",when:"By September",t:"Ethics and the rest",d:"Lock in ethics and round out the remaining competencies."},
    {id:"m3",when:"October",t:"Mock interviews + presentation practice",d:"Practise the presentation and Q&A out loud, repeatedly."},
    {id:"m4",when:"Early November",t:"Light revision",d:"Gentle review and confidence. Sleep well before the day."}];

  function completion(k){var c=day(k).check,n=0;for(var i=0;i<CHECK.length;i++)if(c[CHECK[i].id])n++;return{n:n,total:CHECK.length,pct:Math.round(n/CHECK.length*100)};}
  function isGood(k){return completion(k).n>=GOOD_DAY_MIN;}
  function habitStreak(){var k=todayKey();if(!isGood(k))k=addDaysKey(k,-1);var s=0;while(state.days[k]&&isGood(k)){s++;k=addDaysKey(k,-1);}return s;}
  function studyStreak(){var k=todayKey();if(!(state.days[k]&&state.days[k].focus>0))k=addDaysKey(k,-1);var s=0;while(state.days[k]&&state.days[k].focus>0){s++;k=addDaysKey(k,-1);}return s;}
  function goodDaysThisWeek(){var k=todayKey(),wd=weekdayOf(k),start=addDaysKey(k,-wd),n=0;for(var i=0;i<=wd;i++){var key=addDaysKey(start,i);if(state.days[key]&&isGood(key))n++;}return n;}
  function latestKg(){return state.weights.length?state.weights[state.weights.length-1].kg:state.profile.startKg;}
  function targets(){var cur=latestKg(),p=state.profile;var bmr=10*cur+6.25*p.heightCm-5*p.age+(p.sex==="female"?-161:5);var tdee=bmr*p.activity;
    var target=Math.max(1500,Math.round((tdee-p.deficit)/10)*10);var protein=Math.round(p.proteinPerKg*cur);var fat=Math.round(target*0.25/9);var carbs=Math.max(0,Math.round((target-protein*4-fat*9)/4));
    return{bmr:Math.round(bmr),tdee:Math.round(tdee),target:target,protein:protein,fat:fat,carbs:carbs};}
  function projection(){var cur=latestKg(),goal=state.profile.goalKg,pace=state.profile.pace;var left=cur-goal;if(left<=0)return{reached:true};var weeks=left/pace;var d=new Date();d.setDate(d.getDate()+Math.round(weeks*7));return{reached:false,weeks:Math.round(weeks),date:d,left:left};}

  function elx(id){return document.getElementById(id);}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
  var TICK='<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="#04201b" stroke-width="3.5"><path d="M5 12l4 4L19 7"/></svg>';
  function ringSVG(pct,color){color=color||"var(--teal)";var r=52,c=2*Math.PI*r,off=c*(1-pct/100);
    return '<svg width="116" height="116" viewBox="0 0 116 116"><circle cx="58" cy="58" r="'+r+'" stroke="var(--ring-track)" stroke-width="11" fill="none"/><circle cx="58" cy="58" r="'+r+'" stroke="'+color+'" stroke-width="11" fill="none" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 58 58)" style="transition:stroke-dashoffset .7s ease"/></svg>';}
  function meter(pct,cls){pct=Math.max(0,Math.min(100,pct));return '<div class="meter '+(cls||"")+'"><span style="width:'+pct+'%"></span></div>';}

  // animated SVG demonstrations (SMIL loops)
  var FIG="#9fb0c3",IMP="#2dd4bf";
  function demo(p){
    var L='stroke="'+FIG+'" stroke-width="3" fill="none" stroke-linecap="round"';
    var head='<circle cx="50" cy="22" r="6" '+L+'/>';
    var open='<svg viewBox="0 0 100 80" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">';
    switch(p){

  // ---- renderers ----

    var projTxt=pr.reached?"You have reached your goal weight. Wonderful - now hold the habits.":("Steady pace reaches 78 kg around <b>"+prettyMonth(pr.date)+"</b> (about "+pr.weeks+" weeks).");
    elx("p-today").innerHTML=
      '<div class="card"><div class="ring-wrap"><div class="ring">'+ringSVG(comp.pct)+'<div class="pct"><div class="center"><b>'+comp.pct+'%</b><div class="micro">today</div></div></div></div>'
      +'<div class="grow"><div class="row between"><div class="micro">Daily progress</div><span class="pill teal">'+habitStreak()+'-day streak</span></div>'

  }

  var selDay=null;
  function renderWorkout(){
    var k=todayKey(),today=weekdayOf(k);if(selDay===null)selDay=today;

    }).join(""):'<div class="card"><div class="small muted">Class day. If you have energy, a 10-15 minute easy walk is plenty.</div></div>';

    elx("p-workout").innerHTML=ease+sel
      +'<div class="card"><div class="row between"><h3>'+DOW[selDay]+': '+plan.t+'</h3>'+(selDay===today?'<span class="pill teal">Today</span>':'')+'</div>'
      +'<div class="small muted" style="margin-bottom:10px">'+plan.d+' Sessions are about 45 minutes. Tap "How to do it properly" on any exercise.</div>'

  }

  function renderFood(){
    var k=todayKey(),d=day(k),t=targets(),wpct=Math.round(d.water/state.settings.waterGoal*100);
    var recipes=RECIPES.map(function(r,idx){return '<div class="acc" id="acc'+idx+'"><button data-action="acc" data-i="'+idx+'"><span><div style="font-weight:700">'+r.name+'</div><div class="small muted">'+r.tag+' - '+r.time+'</div></span><span class="chev">v</span></button><div class="body"><div class="inner"><h4>Ingredients</h4><ul>'+r.ing.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul><h4>Steps</h4><ul>'+r.steps.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ul></div></div></div>';}).join("");

      '<div class="card"><h3>Your daily targets</h3><div class="small muted" style="margin-bottom:10px">Calculated from '+latestKg().toFixed(0)+' kg. They update as you log your weight.</div>'
      +'<div class="grid4"><div class="stat center"><div class="n">'+t.target+'</div><div class="l">kcal</div></div><div class="stat center"><div class="n" style="color:var(--teal)">'+t.protein+'</div><div class="l">protein g</div></div><div class="stat center"><div class="n">'+t.carbs+'</div><div class="l">carbs g</div></div><div class="stat center"><div class="n">'+t.fat+'</div><div class="l">fat g</div></div></div>'
      +'<div class="small muted" style="margin-top:10px">A gentle deficit, protein at every meal. This is steady fat loss, not starvation.</div></div>'
      +'<div class="card center"><h3>The plate rule</h3><div class="plate"></div><div class="legend center" style="margin-top:8px"><span><i class="dot" style="background:var(--emerald)"></i>Half vegetables / salad</span><span><i class="dot" style="background:var(--teal-deep)"></i>Palm-sized protein</span><span><i class="dot" style="background:var(--amber)"></i>Smaller rice / roti</span></div><div class="small muted" style="margin-top:8px">Protein at every meal. Water all day. Do not skip meals.</div></div>'

      +sampleRow("Snack","Fruit, or a boiled egg")
      +sampleRow("Dinner","Chicken & vegetable stir-fry (light on rice). Nothing fried, no late noodles.")
      +'</div>'

  }
  function sampleRow(when,what){return '<div class="row" style="align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)"><div style="width:78px;flex:none;font-weight:700;font-size:13px;color:var(--teal)">'+when+'</div><div class="small muted">'+what+'</div></div>';}

  function renderStudy(){
    var d=day();
    var comps=Object.keys(COMPS).map(function(g){var items=COMPS[g].map(function(name){var on=!!state.study.comps[name];return '<button class="check '+(on?"done":"")+'" data-action="toggleComp" data-id="'+esc(name)+'" style="min-height:52px"><span class="box">'+(on?TICK:"")+'</span><span class="grow"><div class="label" style="font-size:14px">'+esc(name)+'</div></span></button>';}).join("");return '<h4 style="color:var(--teal);text-transform:uppercase;letter-spacing:.08em;font-size:12px;margin:8px 2px">'+g+'</h4>'+items;}).join("");

      +'<div class="card"><label class="field"><span class="micro">The one task I will start with next</span><input type="text" data-bind="nextTask" value="'+esc(state.study.nextTask)+'" placeholder="e.g. Draft case study - project background" /></label><div class="small muted" style="margin-top:8px">Practise out loud and write examples in situation, task, action, result form - do not just reread notes.</div></div>'
      +'<h2 class="section">Milestones</h2><div class="card"><div class="tl">'+tl+'</div></div>'
      +'<h2 class="section">Topics & competencies</h2><div class="card">'+comps+'</div>';
    syncTimer();
  }

  function renderProgress(){
    var w=state.weights.slice().sort(function(a,b){return a.date<b.date?-1:1;});
    var cur=latestKg(),start=state.profile.startKg,goal=state.profile.goalKg,lost=start-cur;
    var weeks=w.length>1?Math.max(1,(new Date(w[w.length-1].date)-new Date(w[0].date))/604800000):1;
    var perWk=w.length>1?((w[w.length-1].kg-w[0].kg)/weeks):0;var pr=projection();
    elx("p-progress").innerHTML=
      '<div class="card"><div class="grid2"><div class="stat"><div class="n">'+cur.toFixed(1)+'<span class="small"> kg</span></div><div class="l">Current</div></div><div class="stat"><div class="n" style="color:var(--emerald)">'+(lost>=0?"-":"+")+Math.abs(lost).toFixed(1)+'<span class="small"> kg</span></div><div class="l">Since start ('+start+')</div></div><div class="stat"><div class="n">'+(perWk<=0?"":"+")+perWk.toFixed(2)+'<span class="small"> kg</span></div><div class="l">Per week</div></div><div class="stat"><div class="n">'+Math.max(0,cur-goal).toFixed(1)+'<span class="small"> kg</span></div><div class="l">To goal ('+goal+')</div></div></div>'
      +'<div class="small muted" style="margin-top:10px">'+(pr.reached?"Goal reached - hold your habits.":("On a safe 0.5-1 kg/week pace, around <b>"+prettyMonth(pr.date)+"</b>. Roughly 6-10 kg in the first three months is on track."))+'</div></div>'
      +'<div class="card"><div class="row between"><h3>Weight trend</h3><span class="pill teal">goal '+goal+' kg</span></div>'+chart(w,goal)
      +'<div class="row" style="gap:8px;margin-top:12px"><input type="number" id="wkg" inputmode="decimal" step="0.1" placeholder="Today\'s weight (kg)" /><button class="btn primary" data-action="addWeight">Log</button></div>'
      +'<div class="small muted" style="margin-top:8px">Half a kilo to one kilo a week is the steady, safe pace.</div></div>'
      +'<div class="card"><div class="grid2"><div class="stat"><div class="n" style="color:var(--teal)">'+habitStreak()+'</div><div class="l">Habit streak (days)</div></div><div class="stat"><div class="n" style="color:var(--amber)">'+studyStreak()+'</div><div class="l">Study streak (days)</div></div></div></div>'
      +'<div class="card"><h3>Your details</h3><div class="small muted" style="margin-bottom:10px">Used to calculate your calorie and protein targets.</div>'
      +'<div class="grid2"><label class="field"><span class="micro">Start weight (kg)</span><input type="number" step="0.5" data-bind="startKg" value="'+start+'"/></label><label class="field"><span class="micro">Goal weight (kg)</span><input type="number" step="0.5" data-bind="goalKg" value="'+goal+'"/></label><label class="field"><span class="micro">Height (cm)</span><input type="number" data-bind="heightCm" value="'+state.profile.heightCm+'"/></label><label class="field"><span class="micro">Age</span><input type="number" data-bind="age" value="'+state.profile.age+'"/></label></div></div>'
      +'<div class="note"><div class="micro">Look after yourself</div><div class="small" style="margin-top:4px">If progress stalls for a week or two, that is normal - trust the habits. If you feel faint, very tired or unwell, see a doctor and get your bloods checked. This is a marathon, and you are doing the work.</div></div>';
  }
  function chart(w,goal){var W=480,H=170,pad=24;if(w.length<2)return '<div class="center muted small" style="padding:40px 10px">Log your weight on two or more days to see your trend line here.</div>';
    var kgs=w.map(function(p){return p.kg;}).concat([goal]);var min=Math.min.apply(null,kgs)-1,max=Math.max.apply(null,kgs)+1,span=Math.max(1,max-min),n=w.length;
    function x(i){return pad+i/(n-1)*(W-2*pad);}function y(v){return pad+(1-(v-min)/span)*(H-2*pad);}
    var pts=w.map(function(p,i){return (i?"L":"M")+x(i).toFixed(1)+" "+y(p.kg).toFixed(1);}).join(" ");var len=0;for(var i=1;i<n;i++)len+=Math.hypot(x(i)-x(i-1),y(w[i].kg)-y(w[i-1].kg));
    var gy=y(goal).toFixed(1),dots=w.map(function(p,i){return '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.kg).toFixed(1)+'" r="3" fill="var(--teal)"/>';}).join("");
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><line x1="'+pad+'" y1="'+gy+'" x2="'+(W-pad)+'" y2="'+gy+'" stroke="var(--emerald)" stroke-width="1.5" stroke-dasharray="3 6"/><path class="line" d="'+pts+'" style="--len:'+len.toFixed(0)+'"/>'+dots+'<text x="'+pad+'" y="14" fill="var(--dim)" font-size="11">'+max.toFixed(0)+' kg</text><text x="'+pad+'" y="'+(H-6)+'" fill="var(--dim)" font-size="11">'+min.toFixed(0)+' kg</text></svg>';}

  var timer={mode:"focus",remaining:1500,running:false,h:null};
  function fmt(s){var m=Math.floor(s/60),ss=s%60;return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss;}
  function syncTimer(){var disp=elx("timerDisp");if(!disp)return;disp.textContent=fmt(timer.remaining);disp.classList.toggle("break",timer.mode==="break");var m=elx("timerMode");if(m)m.textContent=timer.mode==="break"?"Short break":"Focus";var b=elx("timerBtn");if(b)b.textContent=timer.running?"Pause":(timer.remaining<(timer.mode==="break"?300:1500)?"Resume":"Start");var fc=elx("focusCount");if(fc)fc.textContent=day().focus;}
  function tickTimer(){if(!timer.running)return;timer.remaining--;if(timer.remaining<=0){if(timer.mode==="focus"){day().focus++;save();try{navigator.vibrate&&navigator.vibrate(120);}catch(e){}timer.mode="break";timer.remaining=300;}else{timer.mode="focus";timer.remaining=1500;}timer.running=false;clearInterval(timer.h);timer.h=null;}syncTimer();}
  function startTimer(){if(timer.running){timer.running=false;clearInterval(timer.h);timer.h=null;syncTimer();return;}timer.running=true;timer.h=setInterval(tickTimer,1000);syncTimer();}
  function resetTimer(){timer.running=false;clearInterval(timer.h);timer.h=null;timer.mode="focus";timer.remaining=1500;syncTimer();}

  var R={today:renderToday,workout:renderWorkout,food:renderFood,study:renderStudy,progress:renderProgress};
  var current="today";
  function show(tab){current=tab;var ps=document.querySelectorAll(".panel");for(var i=0;i<ps.length;i++)ps[i].classList.remove("active");elx("p-"+tab).classList.add("active");var ts=document.querySelectorAll(".nav .tab");for(var j=0;j<ts.length;j++)ts[j].classList.toggle("active",ts[j].dataset.tab===tab);R[tab]();window.scrollTo({top:0,behavior:"smooth"});}

  document.getElementById("nav").addEventListener("click",function(e){var t=e.target.closest(".tab");if(t)show(t.dataset.tab);});
  document.addEventListener("click",function(e){var b=e.target.closest("[data-action]");if(!b)return;var a=b.dataset.action,k=todayKey(),d=day(k);
    if(a==="toggleCheck"){d.check[b.dataset.id]=!d.check[b.dataset.id];save();renderToday();}
    else if(a==="go"){show(b.dataset.tab);}
    else if(a==="selDay"){selDay=+b.dataset.i;renderWorkout();}
    else if(a==="toggleWorkout"){d.workout.done=!d.workout.done;if(d.workout.done)d.check.move=true;save();renderWorkout();}
    else if(a==="exDone"){d.exDone[b.dataset.id]=!d.exDone[b.dataset.id];save();renderWorkout();}
    else if(a==="how"){var h=elx("how-"+b.dataset.id);if(h)h.classList.toggle("open");}
    else if(a==="steps"){d.steps=Math.max(0,d.steps+(+b.dataset.n));save();renderWorkout();}
    else if(a==="water"){d.water=Math.max(0,d.water+(+b.dataset.n));if(d.water>=state.settings.waterGoal)d.check.water=true;save();renderFood();}
    else if(a==="acc"){var ac=elx("acc"+b.dataset.i);if(ac)ac.classList.toggle("open");}
    else if(a==="toggleComp"){state.study.comps[b.dataset.id]=!state.study.comps[b.dataset.id];save();renderStudy();}
    else if(a==="toggleMs"){state.study.milestones[b.dataset.id]=!state.study.milestones[b.dataset.id];save();renderStudy();}
    else if(a==="timerStart"){startTimer();}else if(a==="timerReset"){resetTimer();}
    else if(a==="addWeight"){var inp=elx("wkg"),v=parseFloat((inp.value||"").replace(",","."));if(isFinite(v)&&v>30&&v<400){var ex2=state.weights.filter(function(p){return p.date!==k;});ex2.push({date:k,kg:Math.round(v*10)/10});state.weights=ex2.sort(function(a,b){return a.date<b.date?-1:1;});save();renderProgress();}}
  });
  document.addEventListener("change",function(e){var b=e.target.closest("[data-bind]");if(!b)return;var bind=b.dataset.bind,d=day();
    if(bind==="workoutFeel")d.workout.feel=b.value;else if(bind==="workoutNote")d.workout.note=b.value;else if(bind==="nextTask")state.study.nextTask=b.value;
    else if(bind==="startKg"||bind==="goalKg"||bind==="heightCm"||bind==="age"){var v=parseFloat(b.value);if(isFinite(v)){state.profile[bind]=v;save();renderProgress();return;}}
    save();});
  document.addEventListener("input",function(e){var b=e.target.closest('[data-bind="nextTask"]');if(b){state.study.nextTask=b.value;save();}});

  (function(){var h=new Date().getHours();elx("heroTitle").textContent=h<12?"Good morning":h<17?"Good afternoon":"Good evening";})();
  show("today");
})();
</script>
</body>
</html>
