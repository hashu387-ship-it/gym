<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b1220" />
<meta name="description" content="Personal fitness, food and RICS APC study tracker" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<title>Apex - Train, Fuel, Study</title>
<style>
  :root{
    --bg:#0b1220;--card:rgba(22,33,58,.72);--card2:rgba(24,35,58,.9);--line:#243149;
    --text:#eaf0f7;--muted:#9fb0c3;--dim:#6b7c92;
    --teal:#2dd4bf;--teal2:#14b8a6;--deep:#0e7490;--emerald:#34d399;--amber:#f7b955;--amber-soft:#3a2e0a;--sky:#38bdf8;--violet:#a78bfa;
    --track:#22304a;--shadow:0 18px 40px rgba(0,0,0,.5);--r:20px;--sb:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(900px 500px at 80% -10%,rgba(14,116,144,.35),transparent 60%),radial-gradient(700px 420px at -10% 16%,rgba(167,139,250,.12),transparent 60%),var(--bg);
    color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Naskh Arabic","Helvetica Neue",Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100dvh}
  html[dir=rtl] body{font-family:"Noto Naskh Arabic","Geeza Pro",-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
  .app{max-width:580px;margin:0 auto;padding:0 16px calc(98px + var(--sb))}
  .hero{position:relative;margin:14px -16px 16px;padding:24px 22px 26px;border-radius:0 0 30px 30px;overflow:hidden;background:linear-gradient(150deg,#102036 0%,#0b1220 70%);box-shadow:var(--shadow)}
  .hero::before{content:"";position:absolute;width:340px;height:340px;inset-inline-end:-120px;top:-160px;border-radius:50%;background:conic-gradient(from 0deg,rgba(45,212,191,0),rgba(45,212,191,.5),rgba(56,189,248,.35),rgba(167,139,250,.3),rgba(45,212,191,0));filter:blur(26px);animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(11,18,32,.75));pointer-events:none}
  .hero>*{position:relative;z-index:1}
  .toprow{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .eyebrow{color:var(--teal);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:11px}
  html[dir=rtl] .eyebrow{letter-spacing:0}
  .langbtn{background:rgba(45,212,191,.12);border:1px solid var(--line);color:var(--teal);border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px}
  .hero h1{margin:8px 0 4px;font-size:27px;line-height:1.12}
  .hero .sub{color:var(--muted);font-size:14px;max-width:46ch}
  .quote{margin-top:14px;padding:12px 14px;border-inline-start:3px solid var(--teal);background:rgba(45,212,191,.07);border-radius:0 12px 12px 0;font-size:14px;font-weight:600}
  html[dir=rtl] .quote{border-radius:12px 0 0 12px}
  .row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.wrapr{flex-wrap:wrap}
  .muted{color:var(--muted)}.dim{color:var(--dim)}.small{font-size:13px}.center{text-align:center}
  .micro{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);font-weight:800}
  html[dir=rtl] .micro{letter-spacing:0}
  h2.section{font-size:19px;margin:6px 2px 12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(0,0,0,.28);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:rise .45s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
  .card h3{margin:0 0 4px;font-size:16px}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:800}
  .pill.teal{background:rgba(45,212,191,.14);color:var(--teal)}.pill.amber{background:var(--amber-soft);color:var(--amber)}.pill.dim{background:#1b2740;color:var(--muted)}.pill.violet{background:rgba(167,139,250,.14);color:var(--violet)}.pill.sky{background:rgba(56,189,248,.14);color:var(--sky)}
  button{font:inherit;color:inherit;cursor:pointer}
  .btn{border:1px solid var(--line);background:#1a2841;color:var(--text);border-radius:14px;padding:12px 16px;font-weight:800;min-height:48px;transition:transform .08s,filter .2s}
  .btn:active{transform:scale(.96)}
  .btn.primary{background:linear-gradient(135deg,var(--teal),var(--deep));color:#04201b;border:none;box-shadow:0 8px 20px rgba(45,212,191,.25)}
  .btn.block{width:100%}.btn.sm{min-height:40px;padding:8px 13px;border-radius:11px;font-size:13px}
  .link{background:none;border:none;color:var(--teal);padding:6px 0;font-weight:800;font-size:13px;text-decoration:none;display:inline-block}
  .vid{color:var(--sky)}
  .check{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:rgba(15,24,40,.6);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;min-height:60px;transition:all .2s}
  .check:active{transform:scale(.985)}
  .check .box{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;transition:all .25s}
  .check.done{background:rgba(45,212,191,.10);border-color:rgba(45,212,191,.45)}.check.done .box{background:var(--teal);border-color:var(--teal)}.check.done .label{color:var(--muted)}
  .check .label{font-weight:800}.check .hint{font-size:12px;color:var(--dim)}.tick{width:16px;height:16px}
  .ring-wrap{display:flex;align-items:center;gap:18px}.ring{position:relative;width:118px;height:118px;flex:none}.ring .pct{position:absolute;inset:0;display:grid;place-items:center}.ring .pct b{font-size:27px}
  .meter{height:12px;border-radius:999px;background:var(--track);overflow:hidden}.meter>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),var(--emerald));transition:width .7s cubic-bezier(.2,.7,.3,1)}
  .meter.water>span{background:linear-gradient(90deg,var(--sky),var(--teal))}.meter.steps>span{background:linear-gradient(90deg,var(--amber),#fad27a)}
  .sched{position:relative;margin-inline-start:6px;padding-inline-start:20px}
  .sched::before{content:"";position:absolute;inset-inline-start:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .srow{position:relative;padding:7px 0;display:flex;gap:12px;align-items:flex-start}
  .srow::before{content:"";position:absolute;inset-inline-start:-20px;top:14px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
  .srow.now::before{background:var(--teal);border-color:var(--teal);animation:pulse 1.8s ease-out infinite}
  .srow.pr::before{background:var(--violet);border-color:var(--violet)}
  @keyframes pulse{from{box-shadow:0 0 0 0 rgba(45,212,191,.5)}to{box-shadow:0 0 0 12px rgba(45,212,191,0)}}
  .srow .t{width:52px;flex:none;font-weight:800;font-size:12px;color:var(--teal);font-variant-numeric:tabular-nums;padding-top:1px}
  .srow.pr .t{color:var(--violet)}
  .srow .w{font-size:13.5px;color:var(--muted)}.srow.now .w{color:var(--text);font-weight:700}.srow.pr .w{color:var(--text);font-weight:700}
  .daysel{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.daysel::-webkit-scrollbar{display:none}
  .daysel button{white-space:nowrap;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:800;font-size:13px;flex:none;transition:all .2s}
  .daysel button.active{background:linear-gradient(135deg,var(--teal),var(--deep));color:#04201b;border-color:transparent}
  .exdemo{width:104px;height:84px;flex:none;background:#0f1828;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .fold{max-height:0;overflow:hidden;transition:max-height .35s ease}.fold.open{max-height:640px}
  .exbox{width:27px;height:27px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;background:transparent;transition:all .2s}.exbox.on{background:var(--teal);border-color:var(--teal)}
  .setrow{display:flex;align-items:center;gap:8px;padding:5px 0;font-variant-numeric:tabular-nums}.setrow .del{background:none;border:none;color:var(--dim);font-weight:800;padding:4px 8px}
  input,textarea,select{background:#0f1828;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;width:100%}
  textarea{resize:vertical;min-height:60px}label.field .micro{margin-bottom:6px;display:block}
  .ins{display:flex;gap:8px}.ins input{text-align:center;font-weight:700}
  .coach{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.25);font-size:13px;font-weight:700;color:var(--emerald)}
  .coach.hold{background:rgba(247,185,85,.07);border-color:rgba(247,185,85,.25);color:var(--amber)}
  .plate{width:150px;height:150px;border-radius:50%;margin:6px auto 2px;background:conic-gradient(var(--emerald) 0 50%,var(--deep) 50% 75%,var(--amber) 75% 100%);border:6px solid #0e1726;box-shadow:var(--shadow)}
  .legend span{display:inline-flex;align-items:center;gap:6px;margin:2px 8px 2px 0;font-size:12px;color:var(--muted)}.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
  .acc{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px;background:rgba(15,24,40,.55)}
  .acc>button{width:100%;text-align:start;background:transparent;border:none;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;min-height:54px}
  .acc .body{max-height:0;overflow:hidden;transition:max-height .35s ease}.acc.open .body{max-height:1200px}.acc .inner{padding:0 16px 16px}
  .acc h4{margin:12px 0 6px;font-size:12px;color:var(--teal);text-transform:uppercase;letter-spacing:.08em}.acc ul{margin:0;padding-inline-start:18px}.acc li{margin:4px 0;color:var(--muted);font-size:14px}
  .chev{transition:transform .3s;color:var(--dim)}.acc.open .chev{transform:rotate(180deg)}
  .stat{background:rgba(15,24,40,.6);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.stat .n{font-size:22px;font-weight:800}.stat .l{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
  html[dir=rtl] .stat .l,html[dir=rtl] h2.section{letter-spacing:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .prayer{text-align:center;background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.22);border-radius:12px;padding:8px 4px}
  .prayer .pn{font-size:11px;color:var(--violet);font-weight:800}.prayer .pt{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .chart{width:100%;height:190px}.chart .line{stroke:url(#lg);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.2s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}
  .timer{font-size:58px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}.timer.break{color:var(--amber)}
  .tl{position:relative;margin-inline-start:8px;padding-inline-start:22px}.tl::before{content:"";position:absolute;inset-inline-start:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
  .tl .node{position:relative;margin-bottom:14px}.tl .node::before{content:"";position:absolute;inset-inline-start:-22px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}.tl .node.done::before{background:var(--teal);border-color:var(--teal)}
  .note{border:1px solid var(--amber-soft);background:rgba(247,185,85,.06);border-radius:14px;padding:14px;margin-bottom:14px}.note .micro{color:var(--amber)}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;gap:2px;padding:8px 8px calc(8px + var(--sb));background:rgba(11,18,32,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .nav .tab{flex:1;max-width:112px;background:none;border:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;font-size:11px;font-weight:800;border-radius:12px;transition:color .2s,transform .15s}
  .nav .tab:active{transform:scale(.94)}.nav .tab.active{color:var(--teal)}.nav .tab svg{width:24px;height:24px}.nav .tab.active svg{filter:drop-shadow(0 0 9px rgba(45,212,191,.55))}
  .panel{display:none}.panel.active{display:block;animation:fade .35s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.7,.3,1);background:linear-gradient(180deg,#13203a,#0e1726);border-radius:24px 24px 0 0;border:1px solid var(--line);border-bottom:none;padding:22px 20px calc(24px + var(--sb));max-width:580px;margin:0 auto;box-shadow:0 -18px 50px rgba(0,0,0,.6)}
  .sheet.open{transform:translateY(0)}.resttime{font-size:64px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;color:var(--teal)}
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="toprow"><div class="eyebrow" id="eyebrow">Apex</div><button class="langbtn" data-action="lang" id="langBtn">العربية</button></div>
    <h1 id="heroTitle">Good day</h1>
    <div class="sub" id="heroSub"></div>
    <div class="quote" id="heroQuote"></div>
  </header>
  <main>
    <section class="panel active" id="p-home"></section>
    <section class="panel" id="p-train"></section>
    <section class="panel" id="p-fuel"></section>
    <section class="panel" id="p-study"></section>
    <section class="panel" id="p-progress"></section>
  </main>
</div>
<div class="sheet" id="restSheet">
  <div class="micro center" id="restLabel">Rest - breathe, then go again</div>
  <div class="resttime" id="restTime">90</div>
  <div class="row" style="gap:8px;justify-content:center;margin-top:8px"><button class="btn" data-action="restAdd">+30s</button><button class="btn primary" data-action="restEnd" id="restDone">Done - next set</button></div>
</div>
<nav class="nav" id="nav">
  <button class="tab active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-nav="home">Home</span></button>
  <button class="tab" data-tab="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg><span data-nav="train">Train</span></button>
  <button class="tab" data-tab="fuel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v8a3 3 0 006 0V3M8 3v18M19 3c-2 1-3 3-3 6s1 4 3 4v8"/></svg><span data-nav="fuel">Fuel</span></button>
  <button class="tab" data-tab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l9-3 9 3-9 3-9-3z"/><path d="M21 6v6M7 8v6c0 1.5 10 1.5 10 0V8"/></svg><span data-nav="study">Study</span></button>
  <button class="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg><span data-nav="progress">Progress</span></button>
</nav>
<script src="app.js"></script>
</body>
</html>
